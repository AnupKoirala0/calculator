<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=DotGothic16&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator | anupkoirala0</title>
</head>
<style id="style">
    @media screen and (max-width:360px) {
        .container{
            scale:0.85;
        }
        @media screen and (max-width:309px) {
           .container{ scale:0.6; }
            
        }
    }
    body{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        width: 100dvw;
        margin: 0;
        padding: 0;
    }
    .container{
        display: flex;
        height: 100%;
        width: 100%;
        align-items: center;
        justify-content: center;
    }
    .layout,.main{
        display: flex;
        height: max-content;
        width: 320px;
        align-items: center;
        justify-content: center;
        flex-direction: column;

    }.layout{
        row-gap: 50px; 
        user-select: none;
         -webkit-tap-highlight-color: transparent;
    }
    .main{
        padding: 50px 30px;
        padding-top: 80px;
        border-radius: 20px;
       box-shadow: 4px 4px 8px black,2px 2px 8px grey;
        background: #c3ceea;
        scale: 0.95;
        position: relative;
    }

    .screen{
        display: block;
        width: 100%;
      
        box-shadow: inset 2px 2px 6px black, inset -1px -1px 6px grey;
        height: 80px;
        background: white;
        font-family: "dotgothic16";
        font-size: 22px;

    }
    .scr-top,.scr-bottom{height: 40%; align-items: center;justify-content: center;width: 100%;box-sizing: border-box;padding: 0px 10px;}
    .scr-top{text-align: left;overflow: hidden;width: max-content;}
    .scr-bottom{text-align: right;}
    .buttons{
        display: flex;
        flex-direction: column;
        width: 100%;
        row-gap: 20px;
        font-family:"raleway" ;
        font-size: 20px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        position: relative;
        margin: 0;

        
    }
    .overlay-div{
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        padding: 10px;
        margin-left: -10px;
     
        z-index: 5;

    }
    .bs1,.bs2,.bs3,.bs4,.bs5{
        display: flex;
        justify-content: space-between;
        width: 100%;
        
    }
    .bs1 div{ height: 40px ;
        width: 70px;}
    .bs-b-el{
        display: flex;
        align-items: center;
        justify-content: center;
        height: 70px ;
        width: 70px;
        user-select: none;
         -webkit-tap-highlight-color: transparent;
        border-radius: 10px;
        background: #1c1c1c;
        box-shadow: 4px 4px 6px rgb(65, 65, 65);
         transition: all ease .25s ease;
    } 
    .h3b4ap1{
         display: flex;
        align-items: center;
        justify-content: center;
        height: 70px ;
        width: 70px;
        user-select: none;
         -webkit-tap-highlight-color: transparent;
        border-radius: 10px;
        background: rgb(91, 87, 87);
       font-size: 18px;
        box-shadow: inset 4px 4px 6px rgb(59, 58, 58);
        transition: all ease .25s ease;
        
    } 
    #tpsc{ transition: all ease .35s;padding-right:2px;}
    @keyframes brdr {
        0%,100%{border:none;}
        50%{border-right: 2px dotted black;}
        
    }
    .bs-b-el:hover{
        filter: saturate(3);

    }

</style>
<body>
    <div class="container">
        <div class="main">
            <div class="layout">
                <div class="screen">
<div class="scr-top" id="tpsc"></div>
<div class="scr-bottom" id="bmsc"></div>
                </div>
                <div class="buttons">
                    <div class="bs1">
                        <div class="bs1-e1 h3b4ap bs-b-el"  style="background-color: rgb(255, 127, 7);" data-key="on" id="onb" title="on/off">ON</div>
                        <div class="bs1-e2 h3b4ap bs-b-el"  style="background-color: rgb(28, 40, 69);" data-key="cls" title="clear screen">cls</div>
                        <div class="bs1-e3 h3b4ap bs-b-el"  style="background-color: rgb(28, 40, 69)" data-key="m+" title="">M+</div>
                        <div class="bs1-e4 h3b4ap bs-b-el"  style="background-color: slategray;" data-key="correct" title="correct &#10; decrease input by 1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="45" height="45" viewBox="0 0 784 577">

  <path
    d="M 251 122
       H 659
       Q 670 122 670 137
       V 407
       Q 670 422 659 422
       H 251
       Q 233 422 218 411
       L 58 289
       Q 42 277 58 263
       L 218 137
       Q 233 122 251 122 Z"
    fill="none"
    stroke="#f7f7f7"
    stroke-width="20"
    stroke-linejoin="round"
    stroke-linecap="round"/>
  <path
    d="M 392 207
       Q 389 207 388 205
       Q 385 202 391 202
       L 406 202
       Q 412 202 417 208
       L 461 254
       L 506 208
       Q 511 202 518 202
       L 531 202
       Q 537 202 533 207
       L 476 268
       L 541 337
       Q 546 343 539 343
       L 524 343
       Q 518 343 512 337
       L 461 284
       L 409 337
       Q 404 343 397 343
       L 383 343
       Q 376 343 382 337
       L 445 269 Z"
    fill="#ffffff"/>
</svg>
                        </div>
                    </div>
                    <div class="bs2">
                        <div class="bs2-e1 h3b4ap bs-b-el"  data-key="7">7</div>
                        <div class="bs2-e2 h3b4ap bs-b-el"  data-key="8">8</div>
                        <div class="bs2-e3 h3b4ap bs-b-el"  data-key="9">9</div>
                        <div class="bs2-e4 h3b4ap bs-b-el"  style="background-color: slategray;" data-key="/" title="divide">/</div>
                    </div>
                    <div class="bs3">
                        <div class="bs3-e1 h3b4ap bs-b-el"  data-key="4">4</div>
                        <div class="bs3-e2 h3b4ap bs-b-el"  data-key="5">5</div>
                        <div class="bs3-e3 h3b4ap bs-b-el"  data-key="6">6</div>
                        <div class="bs3-e4 h3b4ap bs-b-el"  style="background-color: slategray;" data-key="*" title="multiply">x</div>
                    </div>
                    <div class="bs4">
                        <div class="bs4-e1 h3b4ap bs-b-el"  data-key="1">1</div>
                        <div class="bs4-e2 h3b4ap bs-b-el"  data-key="2">2</div>
                        <div class="bs4-e3 h3b4ap bs-b-el"  data-key="3">3</div>
                        <div class="bs4-e4 h3b4ap bs-b-el"  style="background-color: slategray;" data-key="-" title="subtract">—</div>
                    </div>
                    <div class="bs5">
                        <div class="bs5-e1 h3b4ap bs-b-el"  data-key="0">0</div>
                        <div class="bs5-e2 h3b4ap bs-b-el"  data-key=".">.</div>
                        <div class="bs5-e3 h3b4ap bs-b-el"  style="background-color: rgb(255, 127, 7);" data-key="=" title="equals">=</div>
                        <div class="bs5-e4 h3b4ap bs-b-el"  style="background-color: slategray;" data-key="+" title="add">＋</div>
                    </div>
                    <div class="overlay-div" id="ovdv"></div>
                    
                </div>
            </div>
        </div>
    </div>
    <script>
        localStorage.setItem("m+",0);
        let ovdv = document.getElementById("ovdv");
        let onb =  document.getElementById("onb");
        let tpsc = document.getElementById("tpsc");
        const bmsc = document.getElementById("bmsc");
        const els = document.querySelectorAll(".h3b4ap");
        els.forEach(elm =>{

            elm.addEventListener("click",()=>{
                if(elm.dataset.key!="on" && onb.innerText=="ON"){
                    tpsc.innerText="";
                    alert("ON the calculator first.");
                }
                else{
                  if(elm.dataset.key=="on" || elm.dataset.key=="cls" || elm.dataset.key=="m+" || elm.dataset.key=="correct" || elm.dataset.key=="=" ){
                    if(elm.dataset.key=="="){
                         console.log("Expression:", tpsc.innerText);
    console.log("Result:", eval(tpsc.innerText));
                        bmsc.innerText=eval(tpsc.innerText);
                    }
                    else if(elm.dataset.key=="correct"){
                       let curr = tpsc.innerText;
                       tpsc.innerText=curr.slice(0,-1);
                    }
                    else if(elm.dataset.key=="cls"){
                        tpsc.innerText="";
                        bmsc.innerText="";
                    }
                    else if(elm.dataset.key=="on"){
                        if(elm.innerText=="ON"){
                            elm.innerText="OFF";
                            
                            let i = 0;
                            const login_text = "anupkoirala0ﾠﾠﾠ";
                            const intv = setInterval(()=>{
                                if(i<login_text.length){
                                    ovdv.style.display="flex";
                                    tpsc.innerText+=login_text[i];
                                    i++;
                                   
                                }
                                else{clearInterval(intv);tpsc.innerText="";
                                    tpsc.style.cssText=`animation:brdr .75s ease infinite;`;
                                    ovdv.style.display="none";
                                }
                            },400);
                            
                        }

                        else{
                              let i = 0;
                            const logoff_text = "Thank You!ﾠﾠﾠ";
                            const outv = setInterval(()=>{
                                if(i<=logoff_text.length){
                                    ovdv.style.display="flex";
                                    tpsc.innerText=logoff_text.slice(0, -i);
                                    i++;
                                   
                                }
                                else{clearInterval(outv);ovdv.style.display="none";
                                }
                            },400);
                            tpsc.innerHTML="";
                            tpsc.style.cssText=`animation:none;`;
                            
                            
                            bmsc.innerText="";
                            elm.innerText="ON";
                        }
                    }
                    else if(elm.dataset.key=="m+"){
                        if(localStorage.getItem("m+")!=0){
                            let resl = eval(tpsc.innerText);
                           
                            tpsc.innerText+=" M+";
                            bmsc.innerText=resl+Number(localStorage.getItem("m+"));
                        }
                        else{
                            localStorage.setItem("m+",(tpsc.innerText));
                            bmsc.innerText=`M+ =${eval(tpsc.innerText)}`;
                        }
                    }
                  }
            else{
               if (elm.dataset.key == ".") {
    const ops = ["+", "-", "*", "/"];
    const text = tpsc.innerText;

    const lastPart = text.split(/[\+\-\*\/]/).at(-1);

    if (lastPart.includes(".")) {
        return;
    }
}

tpsc.innerText += elm.dataset.key;
            }
            }
            });
          
        });
        els.forEach(el =>{
            el.addEventListener("click",()=>{
                  el.classList.remove("bs-b-el");
                    el.classList.add("h3b4ap1");
                setTimeout(() => {
                     el.classList.remove("h3b4ap1");
                el.classList.add("bs-b-el");
                }, 250);
               
            });
          
        });
        
    </script>
</body>
</html>
